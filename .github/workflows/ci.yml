name: Python quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.11
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run cwi-demo
      - run: uv run cwi-evaluate --output outputs/evaluation.json --policy outputs/policy.json
  browser:
    runs-on: ubuntu-latest
    env:
      CWI_API_TOKEN: ci-only-synthetic-operator-token
      CWI_DB: /tmp/cwi-browser.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.12.11
      - run: uv sync --locked
      - run: npm install --prefix /tmp/cwi-browser-tools --no-save --package-lock=false playwright@1.62.1
      - run: node /tmp/cwi-browser-tools/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Exercise operator dashboard
        env:
          NODE_PATH: /tmp/cwi-browser-tools/node_modules
        run: |
          uv run uvicorn cwi.api.app:app_factory --factory --host 127.0.0.1 --port 8765 > /tmp/cwi-api.log 2>&1 &
          CWI_SERVER_PID=$!
          trap 'kill "$CWI_SERVER_PID" || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=1)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("API startup failed")
          PY
          node scripts/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: outputs/browser
