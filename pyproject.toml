[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[project]
name = "cooperative-warehouse-intelligence"
version = "0.2.0"
description = "Grounded human-robot conversations and cooperative warehouse simulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langgraph==1.2.11",
  "ortools==9.15.6755",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1"]

[project.scripts]
cwi-demo = "cwi.demo:main"
cwi-evaluate = "cwi.evaluation.run:main"
cwi-evaluate-llm = "cwi.evaluation.language:main"
cwi-check-runtime = "cwi.evaluation.runtime:main"
cwi-validate-local = "cwi.evaluation.local_validation:main"
cwi-evaluate-speech = "cwi.evaluation.speech:main"
cwi-evaluate-voice = "cwi.evaluation.voice:main"

[project.optional-dependencies]
voice = [
    "faster-whisper==1.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cwi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cwi"]
