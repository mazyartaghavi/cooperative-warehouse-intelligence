[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[project]
name = "cooperative-warehouse-intelligence"
version = "0.1.0"
description = "Grounded text-to-task conversations for warehouse coordination"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1"]

[project.scripts]
cwi-demo = "cwi.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cwi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cwi"]
